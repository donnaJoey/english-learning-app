<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英语打卡">
<title>英语打卡</title>
<style>
  :root{ font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:#f4f6f8; color:#1b2733; }
  .wrap{ max-width:660px; margin:0 auto; padding:12px 12px 48px; }
  h1{ font-size:18px; margin:4px 2px 10px; }
  .card{ background:#fff; border-radius:14px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:12px; }
  input, textarea{ width:100%; font-size:16px; padding:10px 11px; border:1px solid #cbd5e1; border-radius:10px; font-family:inherit; background:#fff; }
  textarea{ min-height:46px; resize:vertical; }
  button{ font-size:15px; padding:9px 14px; border:0; border-radius:10px; background:#2563eb; color:#fff; font-weight:600; cursor:pointer; }
  button.ghost{ background:#e2e8f0; color:#1e293b; }
  button.mini{ font-size:13px; padding:6px 10px; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .hide{ display:none !important; }
  .meta{ font-size:12px; color:#94a3b8; }
  .setLbl{ font-size:13px; color:#475569; margin:10px 0 4px; }

  .tabs{ display:flex; gap:8px; margin-bottom:12px; }
  .tab{ flex:1; background:#e2e8f0; color:#334155; font-weight:700; padding:11px 4px; border-radius:12px; text-align:center; font-size:14.5px; }
  .tab.on{ background:#2563eb; color:#fff; }

  .learners{ display:flex; gap:8px; margin-bottom:10px; }
  .lrn{ background:#eef2f7; color:#334155; border-radius:999px; padding:6px 15px; font-weight:600; }
  .lrn.on{ background:#0ea5e9; color:#fff; }

  .datebar{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .datebar .d{ font-size:15px; font-weight:600; flex:1; text-align:center; }
  .datebar button{ background:#e2e8f0; color:#1e293b; padding:7px 13px; }

  .fb{ background:#ecfdf5; border:1px solid #a7f3d0; color:#065f46; border-radius:12px; padding:12px 14px; margin-bottom:12px; font-size:14px; line-height:1.5; }

  .ck{ display:flex; align-items:center; gap:11px; padding:11px 4px; border-bottom:1px solid #f1f5f9; }
  .ck:last-child{ border-bottom:0; }
  .ck input[type=checkbox]{ width:24px; height:24px; flex:0 0 auto; }
  .ck .t{ font-size:15.5px; line-height:1.35; flex:1; }
  .ck .pt{ font-size:12px; color:#0ea5e9; font-weight:700; flex:0 0 auto; }
  .ck.done .t{ color:#16a34a; text-decoration:line-through; }
  .ck.done .pt{ color:#16a34a; }
  .daysum{ text-align:right; font-size:13px; color:#475569; margin-top:8px; }
  .daysum b{ color:#0ea5e9; font-size:16px; }
  .tplrow{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .tplrow .pin{ width:60px; flex:0 0 auto; text-align:center; }
  .del{ background:#fee2e2; color:#b91c1c; padding:7px 11px; flex:0 0 auto; }
  .add{ width:100%; background:#eff6ff; color:#2563eb; border:1px dashed #93c5fd; margin-top:6px; }
  .daynote{ margin-top:12px; }

  .unit{ font-size:14px; color:#475569; margin:0 2px 10px; }
  .res{ border:1px solid #e2e8f0; border-radius:12px; margin-bottom:10px; overflow:hidden; }
  .res h3{ margin:0; font-size:15.5px; padding:13px 14px; background:#f8fafc; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
  .res h3 .arw{ color:#94a3b8; font-weight:400; }
  .res .body{ padding:4px 14px 14px; }
  .res .tools{ margin:2px 0 10px; }
  .item{ padding:9px 0; border-bottom:1px solid #f1f5f9; font-size:14.5px; line-height:1.5; }
  .item:last-child{ border-bottom:0; }
  .en{ font-weight:600; color:#0f172a; } .cn{ color:#475569; } .eg{ color:#64748b; font-size:13px; margin-top:3px; }
  .blurans .en{ filter:blur(5px); }
  .beat{ padding:7px 0 7px 22px; position:relative; font-size:14.5px; line-height:1.45; }
  .beat b{ color:#0f172a; }
  .beat:before{ content:attr(data-n); position:absolute; left:0; top:7px; color:#0ea5e9; font-weight:700; }
  .lkgroup{ margin:8px 0; } .lkgroup .g{ font-weight:700; color:#0f172a; font-size:14px; } .lkgroup .i{ color:#334155; font-size:14px; }

  .kpis{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .kpi{ flex:1 1 44%; background:#f8fafc; border:1px solid #e2e8f0; border-radius:12px; padding:12px; }
  .kpi .n{ font-size:22px; font-weight:800; color:#0f172a; } .kpi .l{ font-size:12px; color:#64748b; margin-top:2px; }
  .hist{ padding:10px 2px; border-bottom:1px solid #f1f5f9; display:flex; align-items:center; gap:10px; cursor:pointer; }
  .hist:last-child{ border-bottom:0; }
  .hist .hd{ font-size:14px; font-weight:600; flex:1; } .hist .hc{ font-size:12px; color:#64748b; }
  .hist .hp{ font-size:15px; font-weight:800; color:#0ea5e9; }
  .ck2{ padding:11px 2px; border-bottom:1px solid #f1f5f9; }
  .ck2:last-child{ border-bottom:0; }
  .ck2 .t2{ font-size:15px; line-height:1.35; margin-bottom:7px; color:#334155; }
  .ck2.done .t2{ color:#0f172a; font-weight:600; }
  .seg{ display:flex; gap:7px; }
  .seg .lv{ flex:1; background:#f1f5f9; color:#64748b; font-weight:600; font-size:13.5px; padding:8px 4px; border-radius:9px; display:flex; flex-direction:column; align-items:center; gap:1px; line-height:1.2; }
  .seg .lv .lp{ font-size:11px; font-weight:700; opacity:.85; }
  .seg .lv.on.lv1{ background:#dcfce7; color:#166534; }
  .seg .lv.on.lv2{ background:#dbeafe; color:#1e40af; }
  .seg .lv.on.lv3{ background:#fef3c7; color:#92400e; }
  .subh{ display:flex; justify-content:space-between; align-items:center; font-weight:700; color:#0f172a; font-size:14px; margin:16px 0 6px; padding-bottom:4px; border-bottom:1px solid #e2e8f0; }
  .subh .subp{ font-weight:600; color:#0ea5e9; font-size:12.5px; }
  .submeta{ color:#64748b; font-size:12.5px; }
  .tplrow .sin{ width:78px; flex:0 0 auto; }
  .balcard{ background:#eff6ff; border:1px solid #bfdbfe; border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .balcard .baln{ font-size:16px; } .balcard .baln b{ font-size:23px; color:#1d4ed8; }
  .balcard .ball{ font-size:12px; color:#64748b; margin-top:2px; }
  .spendrow{ display:flex; gap:8px; margin-bottom:10px; }
  .spendrow .amt{ width:120px; flex:0 0 auto; }
  .spenditem{ display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid #f1f5f9; font-size:14px; }
  .spenditem:last-child{ border-bottom:0; }
  .spenditem .sd{ color:#94a3b8; font-size:12px; flex:0 0 auto; } .spenditem .sn{ flex:1; } .spenditem .sa{ color:#dc2626; font-weight:700; flex:0 0 auto; }
  .del.mini{ padding:4px 8px; font-size:12px; }
  #roBanner{ background:#fef9c3; border:1px solid #fde68a; color:#854d0e; border-radius:10px; padding:8px 12px; margin-bottom:10px; font-size:13px; }
  .seg .lv:disabled{ opacity:.45; }
  #ownerBar{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  #ownerBar select{ font-size:14px; padding:6px 8px; border:1px solid #cbd5e1; border-radius:8px; }
  #manageBox{ position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:50; display:flex; align-items:flex-start; justify-content:center; padding:28px 12px; overflow:auto; }
  #manageBox .mpanel{ background:#fff; border-radius:14px; padding:16px; max-width:560px; width:100%; }
  .mrow{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .mrow .mn{ flex:1; }

  .status{ font-size:13px; padding:7px 12px; border-radius:999px; background:#eef2f7; color:#475569; }
  .status.ok{ background:#dcfce7; color:#166534; } .status.warn{ background:#fef3c7; color:#92400e; } .status.err{ background:#fee2e2; color:#991b1b; }
  .foot{ margin-top:12px; }

  .ppanel{ border:1px solid #e2e8f0; border-radius:12px; padding:12px; margin-bottom:10px; background:#f8fafc; }
  .ppanel .ph{ font-weight:600; margin-bottom:4px; font-size:14px; }
  .ppanel label{ display:flex; align-items:center; gap:9px; padding:6px 0; font-size:14.5px; }
  .ppanel label input{ width:20px; height:20px; flex:0 0 auto; }
  #printArea{ display:none; }
  @media print {
    body{ background:#fff; }
    body * { visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ display:block !important; position:absolute; left:0; top:0; width:100%; padding:0; }
    @page{ size:A4; margin:14mm; }
  }
  #printArea h1{ font-size:18px; margin:0 0 6px; }
  #printArea h2{ font-size:15px; border-bottom:2px solid #2563eb; padding-bottom:3px; margin:16px 0 8px; page-break-after:avoid; }
  #printArea table{ width:100%; border-collapse:collapse; }
  #printArea td, #printArea th{ border:1px solid #cbd5e1; padding:6px 8px; text-align:left; vertical-align:top; font-size:13px; }
  #printArea th{ background:#f1f5f9; }
  #printArea table.ptest td{ height:30px; }
  #printArea .pg{ width:46%; } #printArea .pw{ width:27%; }
  #printArea .ps{ margin:9px 0; page-break-inside:avoid; } #printArea .psl{ border-bottom:1px solid #cbd5e1; height:24px; margin-top:4px; }
  #printArea .peg{ color:#555; font-size:12px; background:#fafafa; }
  #printArea ol{ margin:4px 0 4px 20px; } #printArea li{ margin:4px 0; }
  #printArea .pnote{ color:#555; font-size:12px; margin-top:4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>英语打卡</h1>

  <div class="card hide" id="setup">
    <div class="setLbl">你是谁?(随便填,比如 妈妈 / 孩子)</div>
    <input id="name" placeholder="妈妈">
    <div class="setLbl">GitHub 钥匙(github_pat_… 粘进来,只存这台设备)</div>
    <input id="token" placeholder="github_pat_..." autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="row" style="margin-top:12px;"><button type="button" onclick="saveSetup()">进入</button></div>
  </div>

  <div class="hide" id="main">
    <div class="learners" id="learners"></div>
    <div class="tabs">
      <div class="tab" id="tabCheck" onclick="setView('check')">📋 打卡</div>
      <div class="tab" id="tabRes" onclick="setView('res')">📚 资料</div>
      <div class="tab" id="tabStats" onclick="setView('stats')">📊 统计</div>
    </div>

    <!-- 打卡 -->
    <div class="card" id="viewCheck">
      <div class="fb hide" id="fb"></div>
      <div class="datebar">
        <button type="button" onclick="shiftDate(-1)">‹</button>
        <div class="d" id="dateLabel"></div>
        <button type="button" onclick="shiftDate(1)">›</button>
        <button type="button" onclick="gotoToday()">今天</button>
      </div>
      <div id="roBanner" class="hide"></div>
      <div id="checklist"></div>
      <div class="daysum" id="daysum"></div>
      <div id="bonusBox"></div>
      <textarea class="daynote" id="daynote" placeholder="今天的备注 / 你的判断 / 新需求(可选)"></textarea>
      <div class="row foot">
        <span class="status" id="status">…</span>
        <button type="button" class="ghost mini" onclick="refreshNow()">拉取最新</button>
        <button type="button" class="ghost mini" id="editBtn" onclick="toggleEditTpl()">编辑清单</button>
      </div>
      <div class="foot" id="ownerBar"></div>
      <div class="row foot"><button type="button" class="ghost mini" onclick="logout()">换钥匙 / 退出</button></div>
    </div>

    <!-- 资料 -->
    <div class="card hide" id="viewRes">
      <div class="unit" id="unitLabel"></div>
      <div class="row" style="margin-bottom:10px"><button type="button" class="ghost mini" onclick="togglePrint()">🖨 打印 / 存 PDF</button></div>
      <div class="ppanel hide" id="printPanel">
        <div class="ph">勾选要打印的部分,再点下面:</div>
        <div id="printOpts"></div>
        <button type="button" style="margin-top:8px" onclick="doPrint()">打印 / 存 PDF</button>
      </div>
      <div id="resList"></div>
    </div>

    <!-- 统计 -->
    <div class="card hide" id="viewStats">
      <div class="kpis" id="kpis"></div>
      <div class="submeta" id="subStats" style="margin:0 2px 10px"></div>
      <div style="font-weight:700;margin:6px 2px 6px">积分银行</div>
      <div id="bank"></div>
      <div style="font-weight:700;margin:14px 2px 6px">历史打卡</div>
      <div id="histList"></div>
    </div>
  </div>
</div>

<div id="manageBox" class="hide"></div>
<div id="printArea"></div>

<script>
const OWNER='donnaJoey', DATA_REPO='english-learning-data', FILE='progress.json';
const SUBJECTS=['语文','英语','数学'];
let data=null, sha=null, dirty=false, saving=false, conflicted=false, timer=null;
let curLearner='我', curDate=todayStr(), editTpl=false, view='check', openRes={}, curUnit=null;

function tok(){ return localStorage.getItem('el_gh_token')||''; }
function me(){ return localStorage.getItem('el_name')||'我'; }
function owner(){ return localStorage.getItem('el_owner')||''; }
function ownerLabel(){ const o=owner(); return o==='__admin__'?'家长':(o||'未设置'); }
function canEdit(L){ const o=owner(); if(!o) return true; return o==='__admin__'||o===L; }
function canManage(){ return !owner() || owner()==='__admin__'; }
function now(){ return new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dstr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function esc(s){ return (s==null?'':''+s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64decode(b64){ return decodeURIComponent(escape(atob((b64||'').replace(/\n/g,'')))); }
function wd(ds){ return ['周日','周一','周二','周三','周四','周五','周六'][new Date(ds+'T00:00:00').getDay()]; }
function status(msg,kind){ const el=document.getElementById('status'); if(el){ el.textContent=msg; el.className='status'+(kind?' '+kind:''); } }

async function gh(method, path, body){
  const res=await fetch('https://api.github.com/repos/'+OWNER+'/'+DATA_REPO+'/'+path,{
    method, headers:{'Authorization':'Bearer '+tok(),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},
    body: body?JSON.stringify(body):undefined, cache:'no-store'});
  let j=null; try{ j=await res.json(); }catch(e){}
  return {status:res.status, json:j};
}

function emptyDoc(){ return {learners:['Joey','Shelby'], template:{}, days:{}, spend:{}, noRes:['Shelby'], resources:{current:'',units:{}}}; }
function ensureDoc(){
  if(!data||typeof data!=='object') data=emptyDoc();
  if(!Array.isArray(data.learners)||!data.learners.length) data.learners=['我','孩子'];
  data.template=data.template||{}; data.days=data.days||{};
  data.learners.forEach(L=>{ if(!Array.isArray(data.template[L])) data.template[L]=[]; if(!data.days[L]) data.days[L]={}; (data.template[L]||[]).forEach(it=>{ if(!it.subject) it.subject='英语'; }); });
  data.resources=data.resources||{current:'',units:{}};
  data.spend=data.spend||{}; data.learners.forEach(L=>{ if(!Array.isArray(data.spend[L])) data.spend[L]=[]; });
  if(!Array.isArray(data.noRes)) data.noRes=[];
  if(!data.learners.includes(curLearner)) curLearner=data.learners[0];
}
function dayObj(){ const L=data.days[curLearner]||(data.days[curLearner]={}); if(!L[curDate]) L[curDate]={checked:{},note:'',feedback:null}; if(!L[curDate].checked) L[curDate].checked={}; return L[curDate]; }
function ptMap(L){ const m={}; (data.template[L]||[]).forEach(it=>{ m[it.id]=Number(it.points)||0; }); return m; }
function dayPoints(L,ds){ const d=(data.days[L]||{})[ds]; if(!d) return 0; const m=ptMap(L); let s=0; if(d.checked){ for(const id in d.checked){ s+=tierValue(m[id]||0, d.checked[id]); } } if(Array.isArray(d.bonus)){ d.bonus.forEach(b=>{ s+=Number(b.amount)||0; }); } return s; }
function dayCount(L,ds){ const d=(data.days[L]||{})[ds]; if(!d||!d.checked) return 0; let n=0; for(const id in d.checked){ if(d.checked[id]) n++; } return n; }
function dayActive(L,ds){ const d=(data.days[L]||{})[ds]; if(!d) return false; return dayCount(L,ds)>0 || (Array.isArray(d.bonus)&&d.bonus.length>0); }
function lvlNum(v){ if(v===true) return 3; v=Number(v); return (v>=1&&v<=3)?v:0; }
function tierVals(max){ max=Number(max)||0; return [Math.max(1,Math.round(max*0.2)), Math.max(1,Math.round(max*0.6)), max]; }
function tierValue(max,level){ const n=lvlNum(level); return n? tierVals(max)[n-1] : 0; }
function subjMap(L){ const m={}; (data.template[L]||[]).forEach(it=>{ m[it.id]=it.subject||'英语'; }); return m; }
function todayBySubject(L,ds){ const sm=subjMap(L), m=ptMap(L), out={}; const d=(data.days[L]||{})[ds]; if(d&&d.checked){ for(const id in d.checked){ const v=tierValue(m[id]||0,d.checked[id]); if(v){ const s=sm[id]||'英语'; out[s]=(out[s]||0)+v; } } } return out; }
function pointsBySubject(L,filt){ const sm=subjMap(L), m=ptMap(L), out={}; const days=data.days[L]||{}; Object.keys(days).forEach(ds=>{ if(filt&&!filt(ds)) return; const d=days[ds]; if(!d||!d.checked) return; for(const id in d.checked){ const v=tierValue(m[id]||0,d.checked[id]); if(v){ const s=sm[id]||'英语'; out[s]=(out[s]||0)+v; } } }); return out; }

async function load(){
  status('读取中…');
  const r=await gh('GET','contents/'+FILE);
  if(r.status===200){ sha=r.json.sha; try{ data=JSON.parse(b64decode(r.json.content)); }catch(e){ data=emptyDoc(); } ensureDoc(); render(); status('已读取 · '+now(),'ok'); }
  else if(r.status===401){ status('钥匙没通过 (401):当前长度 '+tok().length+' 位(应为 93)。点"换钥匙 / 退出"重试','err'); }
  else if(r.status===403){ status('钥匙被拒 (403)','err'); }
  else if(r.status===404){ sha=null; data=emptyDoc(); ensureDoc(); render(); status('还没有数据'); }
  else { status('读取出错 '+r.status,'err'); }
}
function schedule(){ dirty=true; clearTimeout(timer); timer=setTimeout(push,800); }
async function push(){
  if(conflicted||saving) return;
  saving=true; status('保存中…');
  const r=await gh('PUT','contents/'+FILE,{message:'update by '+me(), content:b64encode(JSON.stringify(data,null,2)), sha:sha||undefined});
  saving=false;
  if(r.status===200||r.status===201){ sha=r.json.content.sha; dirty=false; status('已保存 · '+now(),'ok'); }
  else if(r.status===409||r.status===422){ conflicted=true; status('有人刚改过,点"拉取最新"再改','warn'); }
  else { status('没存上 ('+r.status+'),下次改动再试','err'); }
}
async function poll(){
  if(dirty||saving||conflicted) return;
  const r=await gh('GET','contents/'+FILE);
  if(r.status===200 && r.json.sha!==sha){ sha=r.json.sha; try{ data=JSON.parse(b64decode(r.json.content)); }catch(e){ return; } ensureDoc(); render(); status('已更新:别人的改动已同步','ok'); }
}
function refreshNow(){ conflicted=false; dirty=false; load(); }
function setView(v){ view=v; render(); }

function render(){
  ensureDoc();
  const lb=document.getElementById('learners'); lb.innerHTML='';
  data.learners.forEach(L=>{ const b=document.createElement('button'); b.type='button'; b.className='lrn'+(L===curLearner?' on':''); b.textContent=L; b.onclick=()=>{curLearner=L; render();}; lb.appendChild(b); });
  const hideRes=(data.noRes||[]).includes(curLearner);
  if(hideRes && view==='res') view='check';
  document.getElementById('tabCheck').classList.toggle('on', view==='check');
  document.getElementById('tabRes').classList.toggle('on', view==='res');
  document.getElementById('tabRes').classList.toggle('hide', hideRes);
  document.getElementById('tabStats').classList.toggle('on', view==='stats');
  document.getElementById('viewCheck').classList.toggle('hide', view!=='check');
  document.getElementById('viewRes').classList.toggle('hide', view!=='res');
  document.getElementById('viewStats').classList.toggle('hide', view!=='stats');
  if(view==='check') renderCheck(); else if(view==='res') renderRes(); else renderStats();
}

function renderCheck(){
  const ed=canEdit(curLearner); if(!ed) editTpl=false;
  const dl=document.getElementById('dateLabel'); dl.textContent=curDate+' '+wd(curDate)+(curDate===todayStr()?' · 今天':'');
  const day=dayObj(); const fb=document.getElementById('fb');
  if(day.feedback && day.feedback.text){ fb.classList.remove('hide'); fb.innerHTML='<b>📣 Kiro 的反馈'+(day.feedback.at?' · '+esc(day.feedback.at):'')+'</b><br>'+esc(day.feedback.text).replace(/\n/g,'<br>'); }

function renderStats(){

  const today=new Date(todayStr()+'T00:00:00');
  const inLast=(ds,n)=>{ const d=new Date(ds+'T00:00:00'); return (today-d)/86400000 < n && d<=today; };

  dates.forEach(ds=>{ const p=dayPoints(L,ds); pAll+=p; if(inLast(ds,7))p7+=p; if(inLast(ds,30))p30+=p; });

  let streak=0; let cur=new Date(today);

  const ar=document.createElement('div'); ar.className='mrow'; ar.style.marginTop='10px'; const ai=document.createElement('input'); ai.className='mn'; ai.placeholder='新学习者名字'; const ab=document.createElement('button'); ab.type='button'; ab.textContent='添加'; ab.onclick=()=>{ const nn=ai.value.trim(); if(!nn) return; if(data.learners.includes(nn)){ alert('已有同名'); return; } data.learners.push(nn); ensureDoc(); schedule(); renderManage(); render(); }; ar.appendChild(ai); ar.appendChild(ab); p.appendChild(ar);
  box.appendChild(p);
}
function readHash(){ const h=location.hash.replace(/^#/,''); if(!h) return; const p=new URLSearchParams(h); const t=p.get('t'), n=p.get('n'); if(t) localStorage.setItem('el_gh_token', t.replace(/\s/g,'')); if(n) localStorage.setItem('el_name', n); }
function saveSetup(){ const name=document.getElementById('name').value.trim(); const token=document.getElementById('token').value.replace(/\s/g,''); if(!token){ alert('把那串 github_pat_… 粘进来'); return; } localStorage.setItem('el_name', name||'我'); localStorage.setItem('el_gh_token', token); boot(); }
function logout(){ localStorage.removeItem('el_gh_token'); document.getElementById('main').classList.add('hide'); document.getElementById('setup').classList.remove('hide'); }
function boot(){ readHash(); if(!tok()){ document.getElementById('setup').classList.remove('hide'); document.getElementById('main').classList.add('hide'); return; } document.getElementById('setup').classList.add('hide'); document.getElementById('main').classList.remove('hide'); const o=owner(); if(o && o!=='__admin__') curLearner=o; load(); }

setInterval(poll, 15000);
boot();
</script>
