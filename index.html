<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>打卡 · 连接测试</title>
<style>
  :root{ font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#f4f6f8; color:#1b2733; }
  .wrap{ max-width:620px; margin:0 auto; padding:16px; }
  h1{ font-size:19px; margin:8px 0 2px; }
  .sub{ color:#64748b; font-size:13px; margin-bottom:14px; }
  .card{ background:#fff; border-radius:14px; padding:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:14px; }
  label{ display:block; font-size:13px; color:#475569; margin:10px 0 4px; }
  input, textarea{ width:100%; font-size:16px; padding:11px 12px; border:1px solid #cbd5e1; border-radius:10px; font-family:inherit; }
  textarea{ min-height:120px; resize:vertical; }
  button{ font-size:15px; padding:11px 16px; border:0; border-radius:10px; background:#2563eb; color:#fff; font-weight:600; }
  button.ghost{ background:#e2e8f0; color:#1e293b; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .status{ font-size:13px; padding:8px 12px; border-radius:999px; background:#eef2f7; color:#475569; display:inline-block; }
  .status.ok{ background:#dcfce7; color:#166534; }
  .status.warn{ background:#fef3c7; color:#92400e; }
  .status.err{ background:#fee2e2; color:#991b1b; }
  .meta{ font-size:12px; color:#94a3b8; margin-top:8px; }
  .hide{ display:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>打卡 · 连接测试</h1>
  <div class="sub">这一页只用来验证"手机改一下、iPad 立刻看到"。成了之后再换成真正的打卡界面。</div>

  <!-- 首次进入:输钥匙 -->
  <div class="card" id="setup">
    <label>你是谁?(随便填,比如 妈妈 / 孩子)</label>
    <input id="name" placeholder="妈妈">
    <label>GitHub 钥匙(那串 github_pat_… 粘进来,只存在这台设备上)</label>
    <input id="token" placeholder="github_pat_..." autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="row" style="margin-top:12px;">
      <button type="button" onclick="saveSetup()">进入</button>
      <span class="meta">钥匙只存在你这台设备的浏览器里,不会上传到网页。</span>
    </div>
    <div class="meta" id="setupMsg" style="color:#991b1b;margin-top:10px;"></div>
  </div>

  <!-- 主界面 -->
  <div class="card hide" id="main">
    <label>共享便签(两台设备看到的是同一段文字)</label>
    <textarea id="note" placeholder="在这里打字…"></textarea>
    <div class="row" style="margin-top:12px;">
      <span class="status" id="status">…</span>
      <button type="button" class="ghost" onclick="refreshNow()">拉取最新</button>
    </div>
    <div class="meta" id="meta"></div>
    <div class="meta" id="who" style="margin-top:14px;"></div>
    <div class="row" style="margin-top:6px;">
      <button type="button" class="ghost" onclick="logout()">换钥匙 / 退出</button>
    </div>
  </div>
</div>

<script>
const OWNER='donnaJoey';
const DATA_REPO='english-learning-data';
const FILE='progress.json';

let state={demo:{note:'',by:'',at:''}};
let sha=null, dirty=false, saving=false, conflicted=false, timer=null;

function tok(){ return localStorage.getItem('el_gh_token')||''; }
function me(){ return localStorage.getItem('el_name')||''; }
function now(){ return new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}); }

function b64encode(str){ return btoa(unescape(encodeURIComponent(str))); }
function b64decode(b64){ return decodeURIComponent(escape(atob((b64||'').replace(/\n/g,'')))); }

function status(msg, kind){ const el=document.getElementById('status'); el.textContent=msg; el.className='status'+(kind?' '+kind:''); }

async function gh(method, path, body){
  const res = await fetch('https://api.github.com/repos/'+OWNER+'/'+DATA_REPO+'/'+path, {
    method,
    headers:{ 'Authorization':'Bearer '+tok(), 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' },
    body: body ? JSON.stringify(body) : undefined,
    cache:'no-store'
  });
  let j=null; try{ j=await res.json(); }catch(e){}
  return { status:res.status, json:j };
}

function render(){
  const t=document.getElementById('note');
  if(document.activeElement!==t) t.value = state.demo.note||'';
  document.getElementById('meta').textContent = state.demo.at ? ('最后修改:'+(state.demo.by||'?')+' · '+state.demo.at) : '还没有人填过';
}

async function load(){
  status('读取中…');
  const r = await gh('GET','contents/'+FILE);
  if(r.status===200){ sha=r.json.sha; try{ state=JSON.parse(b64decode(r.json.content)); }catch(e){ state={demo:{note:'',by:'',at:''}}; } if(!state.demo) state.demo={note:'',by:'',at:''}; render(); status('已读取 · '+now(),'ok'); }
  else if(r.status===401){ status('钥匙没通过 (401):多半是粘的时候漏了几位。点"换钥匙 / 退出"重粘,确认结尾是 …Vez','err'); }
  else if(r.status===403){ status('钥匙被拒 (403):权限不足。点"换钥匙 / 退出"重试','err'); }
  else if(r.status===404){ sha=null; status('读不到数据 (404):钥匙可能没覆盖到仓库,或粘漏了。点"换钥匙 / 退出"重试','err'); }
  else { status('读取出错 '+r.status,'err'); }
}

function schedule(){ dirty=true; clearTimeout(timer); timer=setTimeout(push,800); }

async function push(){
  if(conflicted||saving) return;
  saving=true; status('保存中…');
  state.demo.by=me(); state.demo.at=now();
  const body={ message:'update from '+(me()||'app'), content:b64encode(JSON.stringify(state,null,2)) };
  if(sha) body.sha=sha;
  const r = await gh('PUT','contents/'+FILE, body);
  saving=false;
  if(r.status===200||r.status===201){ sha=r.json.content.sha; dirty=false; status('已保存 · '+now(),'ok'); }
  else if(r.status===409||r.status===422){ conflicted=true; status('有人刚改过,点"拉取最新"再改','warn'); }
  else { status('没存上 ('+r.status+'),下次改动再试','err'); }
}

async function poll(){
  if(dirty||saving||conflicted) return;
  const r = await gh('GET','contents/'+FILE);
  if(r.status===200 && r.json.sha!==sha){
    sha=r.json.sha; try{ state=JSON.parse(b64decode(r.json.content)); }catch(e){ return; }
    if(!state.demo) state.demo={note:'',by:'',at:''};
    render(); status('已更新:'+(state.demo.by||'对方')+' 的改动','ok');
  }
}

function refreshNow(){ conflicted=false; dirty=false; load(); }

function saveSetup(){
  const name=document.getElementById('name').value.trim();
  const token=document.getElementById('token').value.trim();
  if(!token){ alert('把那串 github_pat_… 粘进来'); return; }
  localStorage.setItem('el_name', name||'我');
  localStorage.setItem('el_gh_token', token);
  boot();
}

function logout(){
  localStorage.removeItem('el_gh_token');
  document.getElementById('main').classList.add('hide');
  document.getElementById('setup').classList.remove('hide');
}

function boot(){
  if(!tok()){ document.getElementById('setup').classList.remove('hide'); document.getElementById('main').classList.add('hide'); return; }
  document.getElementById('setup').classList.add('hide');
  document.getElementById('main').classList.remove('hide');
  document.getElementById('who').textContent='当前身份:'+me();
  const t=document.getElementById('note');
  t.addEventListener('input', ()=>{ state.demo.note=t.value; schedule(); });
  load();
}

setInterval(poll, 12000);
boot();
</script>
</body>
</html>
